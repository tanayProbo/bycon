[package]
name = "node"
version = "0.1.0"
edition = "2021"

[dependencies]
protocol = { path = "../protocol" }
tokio = { version = "1.28", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sled = "0.34"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
jsonrpsee = { version = "0.20", features = ["server", "macros"] }
hex = "0.4.3"
libp2p = { version = "0.52", features = ["tokio", "gossipsub", "mdns", "noise", "yamux", "tcp", "macros"] }
ethereum-types = "0.14"
rlp = "0.5"
secp256k1 = "0.27"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1.28", features = ["full"] }
