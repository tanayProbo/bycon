[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
rlp = "0.5"
rlp-derive = "0.1"
secp256k1 = { version = "0.27", features = ["recovery", "global-context"] }
ethereum-types = "0.14"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
