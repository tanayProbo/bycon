[package]
name = "wallet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "byconn-wallet"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
secp256k1 = { version = "0.27", features = ["rand-std", "recovery", "global-context"] }
ethereum-types = "0.14"
tiny-keccak = { version = "2.0", features = ["keccak"] }
rand = "0.8"
hex = "0.4"
rlp = "0.5"
